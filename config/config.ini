[PATH]
config_dir=config

[FILE]
messages=message_config.json
items=item_config.json

[COLUMN]
observed_date=年月日
avg_temp=平均気温(℃)
max_temp=最高気温(℃)
min_temp=最低気温(℃)
avg_humidity=平均湿度(％)
sunshine_hours=日照時間(時間)
